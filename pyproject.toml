[project]
name = "gravitycheck"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "b84330808", email = "b84330808@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.15.0",
    "av>=18.1.0",
    "huggingface-hub>=2.3.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.21.0",
]

[project.scripts]
gravitycheck = "gravitycheck:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
